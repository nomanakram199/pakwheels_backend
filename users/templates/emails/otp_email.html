<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #f0f0f0; padding: 20px; border-radius: 5px; }
        .otp-box { background-color: #007bff; color: white; padding: 20px; border-radius: 5px; text-align: center; margin: 20px 0; }
        .otp-box .code { font-size: 32px; font-weight: bold; letter-spacing: 5px; }
        .footer { font-size: 12px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Email Verification</h2>
        </div>
        <p>Hi {{ first_name }},</p>
        <p>Welcome to PakWheels! Please verify your email using the OTP below:</p>

        <div class="otp-box">
            <div class="code">{{ otp }}</div>
        </div>

        <p><strong>OTP Details:</strong></p>
        <ul>
            <li>Valid for: 5 minutes</li>
            <li>Do not share this code with anyone</li>
        </ul>

        <p>If you did not request this, please ignore this email.</p>

        <div class="footer">
            <p>© 2026 PakWheels. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
